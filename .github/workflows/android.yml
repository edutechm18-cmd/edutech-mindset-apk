name: Build Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Official App Icon
        run: pip install -q pillow && python3 -c $'import os,re,json,shutil,urllib.request\nfrom urllib.parse import urljoin\nfrom io import BytesIO\nfrom PIL import Image,ImageDraw,ImageFont\nbase="https://edutech-mindset.pages.dev/"\nimg=None\ncands=[]\ntry:\n html=urllib.request.urlopen(urllib.request.Request(base,headers={"User-Agent":"Mozilla/5.0"}),timeout=15).read().decode("utf-8","ignore")\n for m in re.findall(r"(?:href|src|content)=[\\x22\\x27]([^\\x22\\x27]*(?:icon|apple-touch-icon|logo)[^\\x22\\x27]*)[\\x22\\x27]",html,re.I): cands.append(urljoin(base,m))\nexcept Exception:\n pass\ntry:\n mf=json.loads(urllib.request.urlopen(urllib.request.Request(urljoin(base,"manifest.json"),headers={"User-Agent":"Mozilla/5.0"}),timeout=15).read().decode("utf-8","ignore"))\n for ic in mf.get("icons",[]):\n  if "src" in ic: cands.append(urljoin(base,ic["src"]))\nexcept Exception:\n pass\nfor u in cands:\n try:\n  im=Image.open(BytesIO(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=15).read())).convert("RGBA")\n  if im.width>=32 and im.height>=32:\n   img=im\n   break\n except Exception:\n  pass\nif img is None:\n img=Image.new("RGBA",(512,512),(15,42,92,255))\n d=ImageDraw.Draw(img)\n d.ellipse((24,24,488,488),fill=(19,58,128,255),outline=(212,175,55,255),width=18)\n d.text((256,256),"EduTech",fill=(212,175,55,255),anchor="mm",font=ImageFont.load_default())\nfor f,s in {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}.items():\n out=os.path.join("app/src/main/res",f)\n os.makedirs(out,exist_ok=True)\n r=img.resize((s,s),Image.LANCZOS)\n r.save(os.path.join(out,"ic_launcher.png"))\n m=Image.new("L",(s,s),0)\n ImageDraw.Draw(m).ellipse((0,0,s-1,s-1),fill=255)\n rnd=Image.new("RGBA",(s,s),(0,0,0,0))\n rnd.paste(r,(0,0),m)\n rnd.save(os.path.join(out,"ic_launcher_round.png"))\nanydpi="app/src/main/res/mipmap-anydpi-v26"\nif os.path.exists(anydpi): shutil.rmtree(anydpi)\n'
      
      - name: Build Debug APK and AAB
        run: gradle assembleDebug bundleDebug

      - name: Prepare dist artifacts
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/debug -name "*.aab" | head -n 1)
          cp "$APK_PATH" dist/EduTech-Mindset-App.apk
          cp "$AAB_PATH" dist/EduTech-Mindset-PlayStore.aab
          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduTech-Mindset-Build
          path: dist/

      - name: Release APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: EduTech Mindset v2.0.${{ github.run_number }}
          files: |
            dist/EduTech-Mindset-App.apk
            dist/EduTech-Mindset-PlayStore.aab
